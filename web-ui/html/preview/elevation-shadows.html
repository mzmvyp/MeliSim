<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito Sans', sans-serif; background: #EBEBEB; padding: 20px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.card { background: #fff; border-radius: 4px; padding: 20px; min-width: 120px; text-align: center; }
.name { font-size: 10px; font-family: monospace; color: #999; margin-top: 8px; }
</style>
</head>
<body>
<div class="card" style="box-shadow: 0 1px 2px rgba(0,0,0,0.08);">
  Card text
  <div class="name">shadow-1<br>0 1px 2px .08</div>
</div>
<div class="card" style="box-shadow: 0 1px 4px rgba(0,0,0,0.10);">
  Card text
  <div class="name">shadow-2<br>0 1px 4px .10</div>
</div>
<div class="card" style="box-shadow: 0 2px 8px rgba(0,0,0,0.12);">
  Card text
  <div class="name">shadow-3<br>0 2px 8px .12</div>
</div>
<div class="card" style="box-shadow: 0 4px 16px rgba(0,0,0,0.14);">
  Card text
  <div class="name">shadow-4<br>0 4px 16px .14</div>
</div>
<div class="card" style="box-shadow: 0 8px 32px rgba(0,0,0,0.18);">
  Card text
  <div class="name">shadow-5<br>0 8px 32px .18</div>
</div>
</body>
</html>
