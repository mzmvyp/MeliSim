<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito Sans', sans-serif; background: #fff; padding: 20px; }
.row { display: flex; gap: 6px; margin-bottom: 4px; }
.swatch { flex: 1; border-radius: 3px; overflow: hidden; border: 1px solid #f0f0f0; }
.chip { height: 36px; }
.label { padding: 4px 6px; }
.name { font-size: 10px; font-weight: 700; color: #333; }
.hex  { font-size: 9px; color: #666; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#1A1A1A;"></div><div class="label"><div class="name">900</div><div class="hex">#1A1A1A</div></div></div>
  <div class="swatch"><div class="chip" style="background:#333;"></div><div class="label"><div class="name">800</div><div class="hex">#333333</div></div></div>
  <div class="swatch"><div class="chip" style="background:#4D4D4D;"></div><div class="label"><div class="name">700</div><div class="hex">#4D4D4D</div></div></div>
  <div class="swatch"><div class="chip" style="background:#666;"></div><div class="label"><div class="name">600</div><div class="hex">#666666</div></div></div>
  <div class="swatch"><div class="chip" style="background:#808080;"></div><div class="label"><div class="name">500</div><div class="hex">#808080</div></div></div>
  <div class="swatch"><div class="chip" style="background:#999;"></div><div class="label"><div class="name">400</div><div class="hex">#999999</div></div></div>
  <div class="swatch"><div class="chip" style="background:#CCC;"></div><div class="label"><div class="name">300</div><div class="hex">#CCCCCC</div></div></div>
  <div class="swatch"><div class="chip" style="background:#E0E0E0;"></div><div class="label"><div class="name">200</div><div class="hex">#E0E0E0</div></div></div>
  <div class="swatch"><div class="chip" style="background:#EBEBEB;"></div><div class="label"><div class="name">100</div><div class="hex">#EBEBEB</div></div></div>
  <div class="swatch"><div class="chip" style="background:#F5F5F5;"></div><div class="label"><div class="name">50</div><div class="hex">#F5F5F5</div></div></div>
</div>
</body>
</html>
