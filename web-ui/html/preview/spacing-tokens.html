<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito Sans', sans-serif; background: #fff; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 16px; }
.block { border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 4px; }
.tick { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #999; margin-top: 4px; }
.section { margin-bottom: 14px; }
.title { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.bar { background: #FFE600; border-radius: 2px; height: 16px; }
.val { font-size: 11px; color: #333; font-family: 'JetBrains Mono', monospace; width: 32px; }
.lbl { font-size: 11px; color: #666; }
</style>
</head>
<body>
<div class="section">
  <div class="title">Spacing Scale (px)</div>
  <div class="row"><div class="bar" style="width:4px;"></div><div class="val">4</div><div class="lbl">--space-1 · xs</div></div>
  <div class="row"><div class="bar" style="width:8px;"></div><div class="val">8</div><div class="lbl">--space-2 · sm</div></div>
  <div class="row"><div class="bar" style="width:12px;"></div><div class="val">12</div><div class="lbl">--space-3</div></div>
  <div class="row"><div class="bar" style="width:16px;"></div><div class="val">16</div><div class="lbl">--space-4 · md</div></div>
  <div class="row"><div class="bar" style="width:24px;"></div><div class="val">24</div><div class="lbl">--space-6 · lg</div></div>
  <div class="row"><div class="bar" style="width:32px;"></div><div class="val">32</div><div class="lbl">--space-8</div></div>
  <div class="row"><div class="bar" style="width:48px;"></div><div class="val">48</div><div class="lbl">--space-12 · xl</div></div>
  <div class="row"><div class="bar" style="width:64px;"></div><div class="val">64</div><div class="lbl">--space-16</div></div>
</div>
<div class="section">
  <div class="title">Border Radius</div>
  <div style="display:flex;gap:12px;align-items:flex-end;">
    <div style="text-align:center;"><div style="width:32px;height:32px;background:#2D3277;border-radius:2px;"></div><div style="font-size:9px;color:#999;margin-top:4px;font-family:monospace;">2px</div></div>
    <div style="text-align:center;"><div style="width:32px;height:32px;background:#2D3277;border-radius:4px;"></div><div style="font-size:9px;color:#999;margin-top:4px;font-family:monospace;">4px</div></div>
    <div style="text-align:center;"><div style="width:32px;height:32px;background:#2D3277;border-radius:6px;"></div><div style="font-size:9px;color:#999;margin-top:4px;font-family:monospace;">6px</div></div>
    <div style="text-align:center;"><div style="width:32px;height:32px;background:#2D3277;border-radius:8px;"></div><div style="font-size:9px;color:#999;margin-top:4px;font-family:monospace;">8px</div></div>
    <div style="text-align:center;"><div style="width:48px;height:28px;background:#FFE600;border-radius:999px;"></div><div style="font-size:9px;color:#999;margin-top:4px;font-family:monospace;">pill</div></div>
  </div>
</div>
</body>
</html>
