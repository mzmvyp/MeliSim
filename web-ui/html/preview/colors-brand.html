<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito Sans', sans-serif; background: #fff; padding: 20px; }
.row { display: flex; gap: 8px; margin-bottom: 8px; }
.swatch { flex: 1; border-radius: 4px; overflow: hidden; }
.chip { height: 56px; }
.label { padding: 6px 8px; }
.name { font-size: 11px; font-weight: 700; color: #333; }
.hex  { font-size: 10px; color: #666; font-family: monospace; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <div class="chip" style="background:#FFE600;"></div>
    <div class="label"><div class="name">Yellow</div><div class="hex">#FFE600</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#F0D900;"></div>
    <div class="label"><div class="name">Yellow Dark</div><div class="hex">#F0D900</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#FFF59D;"></div>
    <div class="label"><div class="name">Yellow Light</div><div class="hex">#FFF59D</div></div>
  </div>
</div>
<div class="row">
  <div class="swatch">
    <div class="chip" style="background:#2D3277;"></div>
    <div class="label"><div class="name">Blue</div><div class="hex">#2D3277</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#1E2255;"></div>
    <div class="label"><div class="name">Blue Dark</div><div class="hex">#1E2255</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#3D4591;"></div>
    <div class="label"><div class="name">Blue Light</div><div class="hex">#3D4591</div></div>
  </div>
</div>
<div class="row">
  <div class="swatch">
    <div class="chip" style="background:#3483FA;"></div>
    <div class="label"><div class="name">Action Blue</div><div class="hex">#3483FA</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#2968C8;"></div>
    <div class="label"><div class="name">Action Dark</div><div class="hex">#2968C8</div></div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#EBF4FF;border:1px solid #cce0ff;"></div>
    <div class="label"><div class="name">Action Light</div><div class="hex">#EBF4FF</div></div>
  </div>
</div>
</body>
</html>
